function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function device(ua){ua=ua||'';var m=ua.match(/\(([^)]*)\)/);return m?m[1]:ua.slice(0,60);}
async function load(){
  var st=document.getElementById('st');
  var mins=+document.getElementById('win').value;
  var since=new Date(Date.now()-mins*60000).toISOString();
  try{
    var r=await fetch(SUPABASE_URL+'/rest/v1/qitari_users?select=*&created_at=gte.'+encodeURIComponent(since)+'&order=created_at.desc&limit=5000',{headers:{apikey:SUPABASE_KEY}});
    if(!r.ok) throw new Error(r.status);
    var all=await r.json(), seen={}, rows=[];
    all.forEach(function(u){ var k=u.device_id||('r'+u.id); if(!seen[k]){seen[k]=1;rows.push(u);} });
    layer.clearLayers();
    rows.forEach(function(u){
      if(u.lat==null||u.lon==null) return;
      var age=(Date.now()-new Date(u.created_at))/1000;
      var cls='u'+(age>180?' old':'')+((u.speed||0)>0.5?' mv':'');
      var ic=L.divIcon({className:'',html:'<div class="'+cls+'"></div>',iconSize:[16,16],iconAnchor:[8,8]});
      L.marker([u.lat,u.lon],{icon:ic}).addTo(layer).bindPopup(
        '<b>'+esc(u.device)+'</b><br>'+esc(u.os)+' · '+esc(u.browser)+'<br>'+esc(u.lat.toFixed(6))+', '+esc(u.lon.toFixed(6))+
        '<br>±'+esc(u.accuracy==null?'?':Math.round(u.accuracy))+' م · '+(u.speed?(u.speed*3.6).toFixed(1):'0')+' كم/سا<br>'+(age<90?Math.round(age)+' ث':Math.round(age/60)+' د')+'<br><small>'+esc(u.device_id)+'</small>');
    });
    document.getElementById('cnt').textContent=rows.length;
    var pts=rows.filter(function(u){return u.lat!=null&&u.lon!=null}).map(function(u){return [u.lat,u.lon]});
    if(!fitted&&pts.length){ map.fitBounds(L.latLngBounds(pts).pad(0.3),{maxZoom:14}); fitted=true; }
    st.textContent='';
  }catch(e){ st.textContent='⚠️ '+e.message; }
}
document.getElementById('win').onchange=load;
load(); setInterval(load,10000);
</script>
</body>
