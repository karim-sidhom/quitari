  let b = Math.max(0,(n&255) + amt);

  if(maxDistM!=null && best.dist>maxDistM) return null;
  return best;
}
const KZ_TRACK_MATCH_MAX_ENDPOINT_M = 1500;
function kz_nearestPointIndexOnLine(line, pos){
  let bestIdx = 0, bestDist = Infinity;
  for(let i=0;i<line.pts.length;i++){
    const d = haversineTN(pos, line.pts[i]);
    if(d<bestDist){ bestDist=d; bestIdx=i; }
  }
  return {idx:bestIdx, dist:bestDist};
}
function kz_findLineForSegment(A, B){
  if(typeof RAIL_LINES === 'undefined' || !RAIL_LINES.length) return null;
  let best = null;
  RAIL_LINES.forEach(line=>{
    const na = kz_nearestPointIndexOnLine(line, A);
    const nb = kz_nearestPointIndexOnLine(line, B);
    const score = na.dist + nb.dist;
    if(!best || score<best.score){
      best = {line, idxA:na.idx, idxB:nb.idx, distA:na.dist, distB:nb.dist, score};
    }
  });
  return best;
}
function kz_buildSubPath(match){
  const pts = match.line.pts;
  if(match.idxA<=match.idxB) return pts.slice(match.idxA, match.idxB+1);
  return pts.slice(match.idxB, match.idxA+1).slice().reverse();
}
const kzSegmentTrackCache = new Map();
function kz_getTrackSubPath(A, B, nameA, nameB){
  const key = nameA + '→' + nameB;
  if(kzSegmentTrackCache.has(key)) return kzSegmentTrackCache.get(key);
  let result = null;
  if(typeof RAIL_LINES !== 'undefined' && RAIL_LINES.length){
    const match = kz_findLineForSegment(A, B);
    if(match && match.distA<=KZ_TRACK_MATCH_MAX_ENDPOINT_M && match.distB<=KZ_TRACK_MATCH_MAX_ENDPOINT_M && match.idxA!==match.idxB){
      result = kz_buildSubPath(match);
    }
  }
  kzSegmentTrackCache.set(key, result);
  return result;
}
var INACTIVE_MARGIN=20;
function inService(t){
  var stops=parseStops(t.stopsText).filter(function(s){return !s.unknown&&s.time});
  if(stops.length<2) return false;
  var now=Date.now(), a=todayAt(stops[0].time).getTime(), b=todayAt(stops[stops.length-1].time).getTime();
  var d=getLiveDelayForTrain(t)||0;
  return now>=a-INACTIVE_MARGIN*60000 && now<=b+(d+INACTIVE_MARGIN)*60000;
}
return {
  RAIL_LINES:RAIL_LINES, haversine:haversine, THR:RISK_THRESHOLD_M,
  setLive:function(data){ liveTrains=Array.isArray(data)?data:[]; liveFetchOk=true; liveFetchAt=Date.now(); updateLiveOnlyHistory(); },
  setLiveFailed:function(){ liveFetchOk=false; },
  scheduled:function(){ var out=[]; trains.forEach(function(t){ if(!inService(t)) return; var p=trainPositionNow(t); if(!p) return; out.push({t:t,p:p,confirmed:isTrainLiveConfirmed(t)}); }); return out; },
  liveOnly:function(){ var out=[]; liveOnlyEntries().forEach(function(lt){ var p=liveOnlyTrainPosition(lt); if(p) out.push({lt:lt,p:p}); }); return out; },
  icon:trainIconSvg,
  liveUrl:SNCFT_LIVE_URL
};
})();
var map=L.map('map',{zoomControl:true}).setView([36.0,9.8],7);
var street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
var sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});
var satOn=false;
document.getElementById('sat').onclick=function(){ if(satOn){map.removeLayer(sat);street.addTo(map);}else{map.removeLayer(street);sat.addTo(map);} satOn=!satOn; };
QT.RAIL_LINES.forEach(function(l){ L.polyline(l.pts,{color:'#111',weight:3,opacity:.85}).addTo(map); });
var layer=L.layerGroup().addTo(map), trainLayer=L.layerGroup().addTo(map), riskLayer=L.layerGroup().addTo(map), fitted=false, lastUsers=[], lastTrainPts=[], userItems=[];
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
async function loadUsers(){
  var st=document.getElementById('st');
  var mins=+document.getElementById('win').value;
  var since=new Date(Date.now()-mins*60000).toISOString();
  try{
    /* vue qitari_users_latest = آخر سطر فقط لكل جهاز؛ نقرأها صفحةً صفحة (1000) حتى النهاية فلا سقف على عدد المستخدمين */
    var all=[], off=0, PAGE=1000;
    while(true){
      var r=await fetch(SUPABASE_URL+'/rest/v1/qitari_users_latest?select=*&created_at=gte.'+encodeURIComponent(since)+'&order=created_at.desc&limit='+PAGE+'&offset='+off,{headers:{apikey:SUPABASE_KEY}});
      if(!r.ok) throw new Error(r.status);
      var part=await r.json(); all=all.concat(part);
      if(part.length<PAGE||all.length>=50000) break;
      off+=PAGE;
    }
    var seen={}, rows=[];
    all.forEach(function(u){ var k=u.device_id||('r'+u.id); if(!seen[k]){seen[k]=1;rows.push(u);} });
    lastUsers=rows.filter(function(u){return u.lat!=null&&u.lon!=null});
    document.getElementById('cnt').textContent=rows.length;
    var pts=rows.filter(function(u){return u.lat!=null&&u.lon!=null}).map(function(u){return [u.lat,u.lon]});
    if(!fitted&&pts.length){ map.fitBounds(L.latLngBounds(pts).pad(0.3),{maxZoom:14}); fitted=true; }
    st.textContent='';
    computeRisks();
  }catch(e){ st.textContent='⚠️ '+e.message; }
}
async function loadTrains(){
  try{
    var r=await fetch(QT.liveUrl,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    QT.setLive(await r.json());
  }catch(e){ QT.setLiveFailed(); }
  drawTrains();
}
function drawTrains(){
  trainLayer.clearLayers(); var n=0; lastTrainPts=[];
  QT.scheduled().forEach(function(x){
    n++; lastTrainPts.push({id:x.t.name.split('—')[0].trim(),lat:x.p.lat,lon:x.p.lon});
    var ic=L.divIcon({className:'train-icon-all',html:QT.icon(30,false),iconSize:[30,30],iconAnchor:[15,15]});
    var num=x.t.name.split('—')[0].trim();
    L.marker([x.p.lat,x.p.lon],{icon:ic}).addTo(trainLayer)
      .bindTooltip(num,{permanent:true,direction:'top',offset:[0,-12],className:'train-label'})
      .bindPopup('<b>'+esc(x.t.name)+'</b><br>'+esc(x.p.fromStation)+' → '+esc(x.p.toStation)+(x.p.delayMin?'<br>+'+x.p.delayMin+' د':'')+'<br>'+(x.confirmed?'✅ SNCFT Live':'⏳ الجدول فقط'));
  });
  QT.liveOnly().forEach(function(x){
    n++; lastTrainPts.push({id:'🔵 '+x.lt.num,lat:x.p.lat,lon:x.p.lon});
    var ic=L.divIcon({className:'train-icon-all',html:QT.icon(30,false,'#1e90ff'),iconSize:[30,30],iconAnchor:[15,15]});
    L.marker([x.p.lat,x.p.lon],{icon:ic}).addTo(trainLayer)
      .bindTooltip('🔵 '+esc(x.lt.num),{permanent:true,direction:'top',offset:[0,-12],className:'train-label'})
      .bindPopup('<b>🔵 '+esc(x.lt.num)+'</b> (SNCFT Live)<br>'+esc(x.p.fromStation)+' → '+esc(x.p.toStation)+(x.p.delayMin?'<br>+'+x.p.delayMin+' د':''));
  });
  document.getElementById('tcnt').textContent=n;
  computeRisks();
}
/* ===== عرض المستخدمين: تجميع القريبين في فقاعة واحدة (عدد + لون الأخطر)، وتفكيكها بالتكبير إلى دوائر فردية بنسبتها ===== */
var RANK={g:0,o:1,r:2};
function renderUsers(){
  layer.clearLayers();
  var b=map.getBounds().pad(0.2), CELL=56, cells={};
  userItems.forEach(function(it){
    if(!b.contains([it.lat,it.lon])) return;
    var p=map.latLngToContainerPoint([it.lat,it.lon]), k=Math.floor(p.x/CELL)+':'+Math.floor(p.y/CELL), c=cells[k];
    if(!c) cells[k]=c={n:0,la:0,lo:0,col:'g',items:[]};
    c.n++; c.la+=it.lat; c.lo+=it.lon; c.items.push(it); if(RANK[it.col]>RANK[c.col]) c.col=it.col;
  });
  for(var k in cells){ var c=cells[k];
    if(c.n===1){ var it=c.items[0];
      var ic=L.divIcon({className:'',html:'<div class="rc '+it.col+(it.stale?' stale':'')+'">'+it.pct+'%</div>',iconSize:[38,38],iconAnchor:[19,19]});
      L.marker([it.lat,it.lon],{icon:ic,zIndexOffset:1000+(RANK[it.col]*1000)}).addTo(layer).bindPopup(it.html);
    } else {
      var sz=Math.min(64,34+Math.log(c.n)*6);
      var ic2=L.divIcon({className:'',html:'<div class="cl '+c.col+'" style="width:'+sz+'px;height:'+sz+'px">'+c.n+'</div>',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
      (function(cc){ L.marker([cc.la/cc.n,cc.lo/cc.n],{icon:ic2,zIndexOffset:1000+(RANK[cc.col]*1000)}).addTo(layer).on('click',function(){
        map.fitBounds(L.latLngBounds(cc.items.map(function(i){return [i.lat,i.lon]})).pad(0.3),{maxZoom:18}); }); })(c);
    }
  }
}
map.on('moveend zoomend',renderUsers);
/* ===== نسبة الاصطدام: نفس صيغة Qitari بالضبط: max(0, 1 - المسافة/150م) × 100 ===== */
function riskPct(d){ return Math.round(Math.max(0,1-d/QT.THR)*100); }
function computeRisks(){
  riskLayer.clearLayers();
  var list=[], T=QT.THR;
  userItems=[];
  lastUsers.forEach(function(u){
    var best=null;
    lastTrainPts.forEach(function(t){ var d=QT.haversine([u.lat,u.lon],[t.lat,t.lon]); if(!best||d<best.d) best={d:d,t:t}; });
    /* إنذار Qitari يرنّ عند هذا المستخدم (مُرسَل من تطبيقه نفسه) = 100% أحمر */
    var age=(Date.now()-new Date(u.created_at))/1000;
    var alarm=(u.alarm===true && age<=180);
    var pct=alarm?100:((best&&best.d<T)?riskPct(best.d):0);
    var col=alarm?'r':(pct>0?'o':'g');
    if(alarm) list.push({kind:'u',a:(u.device||'مستخدم'),b:best?best.t.id:'—',d:best?best.d:null,pct:100,alarm:true,pa:[u.lat,u.lon],pb:best?[best.t.lat,best.t.lon]:null});
    else if(pct>0) list.push({kind:'u',a:(u.device||'مستخدم'),b:best.t.id,d:best.d,pct:pct,alarm:false,pa:[u.lat,u.lon],pb:[best.t.lat,best.t.lon]});
    userItems.push({lat:u.lat,lon:u.lon,pct:pct,col:col,stale:age>180,
      html:'<b>'+esc(u.device)+'</b><br>'+esc(u.os)+' · '+esc(u.browser)+'<br>'+esc(u.lat.toFixed(6))+', '+esc(u.lon.toFixed(6))+
      '<br>±'+esc(u.accuracy==null?'?':Math.round(u.accuracy))+' م · '+(u.speed?(u.speed*3.6).toFixed(1):'0')+' كم/سا<br>'+(age<90?Math.round(age)+' ث':Math.round(age/60)+' د')+
      '<br><b>'+pct+'%</b>'+(alarm?' 🔔':'')+'<br><small>'+esc(u.device_id)+'</small>'});
  });
  renderUsers();
  list.sort(function(x,y){return y.pct-x.pct});
  list.forEach(function(r){ if(!r.pb) return; L.polyline([r.pa,r.pb],{color:'#ff2d2d',weight:4,dashArray:'6 6'}).addTo(riskLayer).bindTooltip(r.pct+'%',{permanent:true,className:'train-label'}); });
  var el=document.getElementById('risk');
  var up=list.filter(function(r){return r.kind==='u'});
  var h='<b>⚠️ نسبة الاصطدام</b>';
  if(!list.length) h+='<div class="r">0% — لا خطر (لا قطار ضمن '+T+' م)</div>';
  up.forEach(function(r){ h+='<div class="r"><span class="hi">'+r.pct+'%</span> '+(r.alarm?'🔔 ':'')+'👤 '+esc(r.a)+' ↔ 🚆 '+esc(r.b)+(r.d!=null?' · '+Math.round(r.d)+' م':'')+'</div>'; });
  el.innerHTML=h; el.style.display='block';
}
document.getElementById('win').onchange=loadUsers;
loadUsers(); loadTrains();
setInterval(loadUsers,10000); setInterval(loadTrains,15000);

    navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'}))).catch(function(){});
  }catch(e){}
}
